name: Push and PR

on:
  push:
    branches:
      - '[0-9]+-stable'
      - '[0-9]+-dev'
  pull_request:

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run test

  release:
    name: Release process
    if: ${{ github.event_name == 'push' && (endsWith(github.ref_name, '-stable') || endsWith(github.ref_name, '-dev')) }}
    needs: [lint, functional-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 22: the workspaces release mode publishes through the
      # system npm rather than the one bundled inside @semantic-release/npm,
      # and Node 22 still ships npm 10.9, which cannot do the OIDC exchange
      # that npm trusted publishing requires. Node 24 ships npm 11.19.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Names the changelog file (changelogs/CHANGELOG_<channel>.md) *and*
          # the npm dist-tag. It must match the `channel` the branch declares in
          # .releaserc.json, otherwise a release is published under a tag no one
          # subscribes to.
          RELEASE_CHANNEL: >-
            ${{ github.ref_name == '2-stable' && '2-stable'
             || github.ref_name == '2-dev' && 'dev'
             || github.ref_name == '1-stable' && '1.x'
             || github.ref_name == '1-dev' && '1.x-dev'
             || github.ref_name }}
          # The current stable branch. In workspaces mode the shared config
          # publishes with `--tag $RELEASE_CHANNEL` and maps it to `latest` only
          # when it equals this value, so bumping the major means bumping this
          # too — otherwise `npm install` keeps serving the previous major.
          SEMANTIC_RELEASE_RELEASE_BRANCH: 2-stable
          SEMANTIC_RELEASE_NPM_BUILD: 'true'
          SEMANTIC_RELEASE_NPM_PUBLISH: 'true'
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release

      # No backmerge job here on purpose: after a release on master, someone
      # merges master back into 1-dev by hand. See CONTRIBUTING.md.

  documentation_deploy:
    name: Documentation - Deploy
    needs: [release]
    if: ${{ github.event_name == 'push' && (endsWith(github.ref_name, '-stable') || endsWith(github.ref_name, '-dev')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # `repo_name` and `version` must match the entry in
      # kuzzleio/documentation .repos/repositories.json, otherwise
      # `kuzdoc install` resolves no repo and silently builds nothing.
      - uses: convictional/trigger-workflow-and-wait@v1.6.3
        with:
          owner: kuzzleio
          repo: documentation
          github_token: ${{ secrets.ACCESS_TOKEN_CI }}
          workflow_file_name: child_repo.workflow.yml
          # A `-stable` branch deploys to docs.kuzzle.io, a `-dev` one to
          # docs-next.kuzzle.io; the doc version is the major the branch carries.
          ref: ${{ endsWith(github.ref_name, '-stable') && 'master' || 'develop' }}
          client_payload: '{"repo_name":"eslint-plugin-kuzzle","branch":"${{ github.ref_name }}","version":"${{ startsWith(github.ref_name, ''1-'') && ''1'' || ''2'' }}"}'
