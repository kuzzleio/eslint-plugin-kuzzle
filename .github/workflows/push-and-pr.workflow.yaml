name: Push and PR

on:
  push:
    branches:
      - master
      - beta
      - '[0-9]+-dev'
  pull_request:

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run lint

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run test

  release:
    name: Release process
    if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'beta' || endsWith(github.ref_name, '-dev')) }}
    needs: [lint, functional-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 22: the workspaces release mode publishes through the
      # system npm rather than the one bundled inside @semantic-release/npm,
      # and Node 22 still ships npm 10.9, which cannot do the OIDC exchange
      # that npm trusted publishing requires. Node 24 ships npm 11.19.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Names the changelog file (changelogs/CHANGELOG_<channel>.md). Without
          # it, the shared config falls back to the branch name.
          RELEASE_CHANNEL: ${{ github.ref_name == '1-dev' && 'dev' || github.ref_name }}
          SEMANTIC_RELEASE_NPM_BUILD: 'true'
          SEMANTIC_RELEASE_NPM_PUBLISH: 'true'
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release

      # - name: Rebase dev branch (keep linear history)
      #   if: ${{ github.ref != 'refs/heads/1-dev' }}
      #   run: |
      #     git fetch --no-tags origin 1-dev:1-dev
      #     git rebase ${GITHUB_REF_NAME} 1-dev
      #     git push origin 1-dev

  documentation_deploy:
    name: Documentation - Deploy
    needs: [release]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == '1-dev') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # `repo_name` and `version` must match the entry in
      # kuzzleio/documentation .repos/repositories.json, otherwise
      # `kuzdoc install` resolves no repo and silently builds nothing.
      - uses: convictional/trigger-workflow-and-wait@v1.6.3
        with:
          owner: kuzzleio
          repo: documentation
          github_token: ${{ secrets.ACCESS_TOKEN_CI }}
          workflow_file_name: child_repo.workflow.yml
          ref: ${{ github.ref_name == 'master' && 'master' || 'develop' }}
          client_payload: '{"repo_name":"eslint-plugin-kuzzle","branch":"${{ github.ref_name }}","version":"1"}'
